<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BarberSchedule · Sistema de Citas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Sistema de gestión de citas para barbería — BarberSchedule">
  <meta name="theme-color" content="#fbbf24" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BarberSchedule">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="BarberSchedule">
  <meta name="format-detection" content="telephone=no">

  <!-- PWA manifest + íconos -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">

  <!-- Open Graph (cuando se comparte en WhatsApp/Twitter) -->
  <meta property="og:title" content="BarberSchedule · Sistema de Citas">
  <meta property="og:description" content="Agenda tu cita en segundos">
  <meta property="og:image" content="icons/icon-512.png">
  <meta property="og:type" content="website">

  <!-- Fuentes: Playfair Display (display) + Inter (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <app-root>
    <!-- Initial loader: visible antes que Angular monte -->
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#0c0a09;color:#d3853a;font-family:serif;">
      <div style="text-align:center">
        <div style="font-size:48px;animation:pulse 1.5s infinite">💈</div>
        <div style="margin-top:12px;letter-spacing:.3em;font-size:12px;">BARBERSCHEDULE</div>
      </div>
    </div>
    <style>
      @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
    </style>
    <noscript>
      <p style="color:white;padding:2rem;font-family:sans-serif;">
        Esta aplicación requiere JavaScript habilitado.
      </p>
    </noscript>
  </app-root>
</body>
</html>
