<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BarberSchedule · Sistema de Citas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema de gestión de citas para barbería — BarberSchedule">
  <meta name="theme-color" content="#0c0a09">

  <!-- Fuentes: Playfair Display (display) + Inter (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23b5641f'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='white'%3E%E2%9C%82%3C/text%3E%3C/svg%3E">
</head>
<body>
  <app-root>
    <!-- Initial loader: visible antes que Angular monte -->
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#0c0a09;color:#d3853a;font-family:serif;">
      <div style="text-align:center">
        <div style="font-size:48px;animation:pulse 1.5s infinite">💈</div>
        <div style="margin-top:12px;letter-spacing:.3em;font-size:12px;">BARBERSCHEDULE</div>
      </div>
    </div>
    <style>
      @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
    </style>
  </app-root>
</body>
</html>
