<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo con gradiente de marca (brand dark + brand gold) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#44403c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#b87f0a"/>
    </linearGradient>
    <pattern id="spiral" x="0" y="0" width="120" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="120" height="40" fill="#ffffff"/>
      <polygon points="0,0 60,0 0,40" fill="#dc2626"/>
      <polygon points="60,0 120,0 120,40 0,40" fill="#ffffff"/>
      <polygon points="60,0 120,0 60,40" fill="#1d4ed8"/>
    </pattern>
  </defs>

  <!-- Fondo redondeado con gradiente -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Círculo de glow detrás del poste -->
  <circle cx="256" cy="256" r="180" fill="#fbbf24" opacity="0.12"/>
  <circle cx="256" cy="256" r="140" fill="#fbbf24" opacity="0.15"/>

  <!-- Barber pole (centrado) -->
  <g transform="translate(180, 100)">
    <!-- Base -->
    <rect x="0" y="280" width="152" height="40" fill="#1c1917"/>
    <rect x="-8" y="270" width="168" height="14" fill="url(#gold)"/>

    <!-- Cuerpo del poste -->
    <rect x="40" y="20" width="72" height="260" fill="url(#spiral)"/>

    <!-- Top cap -->
    <ellipse cx="76" cy="20" rx="42" ry="10" fill="url(#gold)"/>
    <ellipse cx="76" cy="10" rx="34" ry="8" fill="#fcd34d"/>

    <!-- Bola dorada arriba -->
    <circle cx="76" cy="-2" r="14" fill="url(#gold)" stroke="#b87f0a" stroke-width="2"/>
  </g>
</svg>
